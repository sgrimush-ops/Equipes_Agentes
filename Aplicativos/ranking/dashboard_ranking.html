<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Dashboard Ranking de Fornecedores</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/jquery.dataTables.min.css" />
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
	<style>
		:root {
			--bg-1: #f5efe4;
			--bg-2: #f8fafc;
			--ink: #1f2937;
			--ink-soft: #6b7280;
			--brand: #a8550f;
			--brand-strong: #7c2d12;
			--card: #ffffff;
			--line: #e5e7eb;
		}

		* { box-sizing: border-box; }

		body {
			margin: 0;
			font-family: 'Manrope', sans-serif;
			color: var(--ink);
			background:
				radial-gradient(circle at 0% 0%, #fde68a 0%, transparent 35%),
				radial-gradient(circle at 100% 100%, #bfdbfe 0%, transparent 30%),
				linear-gradient(160deg, var(--bg-1), var(--bg-2));
			min-height: 100vh;
			padding: 16px 20px;
		}

		.container {
			max-width: 98%;
			margin: 0 auto;
		}

		.hero {
			background: linear-gradient(120deg, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.82));
			border: 1px solid rgba(255, 255, 255, 0.9);
			border-radius: 10px;
			padding: 8px 16px;
			box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
			margin-bottom: 10px;
			animation: riseIn 450ms ease-out;
		}

		h1 {
			margin: 0;
			color: var(--brand-strong);
			font-size: 1.15rem;
			letter-spacing: -0.01em;
			line-height: 1.2;
		}

		.card {
			background: var(--card);
			border: 1px solid var(--line);
			border-radius: 16px;
			padding: 14px;
			box-shadow: 0 10px 24px rgba(15, 23, 42, 0.06);
			animation: riseIn 500ms ease-out;
		}

		table.dataTable {
			font-size: 0.82rem;
		}

		table.dataTable thead th {
			background: #fff7ed;
			color: #9a3412;
			border-bottom: 1px solid #fed7aa;
			font-weight: 800;
			font-size: 0.80rem;
			padding: 6px 8px;
			white-space: normal;
			word-break: break-word;
		}

		table.dataTable tbody tr:hover {
			background: #fffbeb;
		}

		table.dataTable tbody td {
			white-space: nowrap;
			padding: 5px 8px;
			font-size: 0.82rem;
		}

		table.dataTable thead tr.totais-row th {
			background: #ffedd5;
			border-top: 1px solid #fed7aa;
			border-bottom: 1px solid #fed7aa;
			font-weight: 800;
			padding: 6px 8px;
			text-align: right;
			white-space: nowrap;
			color: #7c2d12;
			font-size: 0.83rem;
		}

		table.dataTable thead tr.totais-row th:first-child {
			text-align: left;
		}

		.dataTables_wrapper {
			font-size: 0.82rem;
		}

		.dataTables_wrapper .dataTables_filter input,
		.dataTables_wrapper .dataTables_length select {
			border: 1px solid #d1d5db;
			border-radius: 8px;
			padding: 4px 8px;
			font-size: 0.82rem;
			background: #fff;
		}

		.dataTables_wrapper .dataTables_paginate .paginate_button.current {
			background: #fdba74 !important;
			color: #7c2d12 !important;
			border: 1px solid #fb923c !important;
			border-radius: 8px;
		}

		@keyframes riseIn {
			from { opacity: 0; transform: translateY(8px); }
			to { opacity: 1; transform: translateY(0); }
		}

		@media (max-width: 700px) {
			body { padding: 10px; }
			.hero { padding: 10px 14px; }
			.card { padding: 10px; }
		}

		/* Forçar orientação de paisagem para impressão/salvar em PDF */
		@media print {
			@page {
				size: landscape;
				margin: 10mm;
			}
			body {
				background: none !important;
				padding: 0 !important;
			}
			.container {
				max-width: 100% !important;
				width: 100% !important;
			}
			.hero {
				box-shadow: none !important;
				border: none !important;
				padding: 0 0 10px 0 !important;
				margin-bottom: 10px !important;
				background: transparent !important;
			}
			.card {
				box-shadow: none !important;
				border: none !important;
				padding: 0 !important;
			}
			.dataTables_length, .dataTables_filter, .dataTables_paginate, .dataTables_info {
				display: none !important;
			}
		}
	</style>
</head>
